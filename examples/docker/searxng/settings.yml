# Development-only settings for the external example instance. `SEARXNG_SECRET`
# from docker-compose.yml supplies the real secret; this value is only the
# fallback SearXNG ships with, so never reuse it on a non-loopback instance.
# The packaged managed setup renders its own settings from
# assets/docker/settings.yml.template with a generated secret and never uses
# this file.
use_default_settings: true

server:
  secret_key: "ultrasecretkey"
  # The limiter is disabled for a loopback-only instance. If you ever expose
  # this instance beyond localhost, re-enable it (`limiter: true`).
  limiter: false

search:
  # The dsh plugin needs `json` here. Most public instances enable only
  # `html`, which is why no public instance is configured by default.
  formats:
    - html
    - json
